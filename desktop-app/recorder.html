<!doctype html>
<html><body><script>
let recorder;
let chunks = [];
let startedAt = null;
window.acecallRecorder.onStart(async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  recorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : undefined });
  startedAt = new Date().toISOString();
  recorder.ondataavailable = event => { if (event.data.size) event.data.arrayBuffer().then(buffer => window.acecallRecorder.sendChunk(buffer)); };
  recorder.onstop = () => { stream.getTracks().forEach(track => track.stop()); window.acecallRecorder.stopped({ startedAt, mimeType: recorder.mimeType }); };
  recorder.start(10000);
});
window.acecallRecorder.onStop(() => { if (recorder && recorder.state !== 'inactive') recorder.stop(); });
</script></body></html>
