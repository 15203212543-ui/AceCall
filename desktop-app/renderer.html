<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AceCall Sync</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#18231e;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}.shell{max-width:720px;margin:0 auto;padding:32px}.head{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:42px;height:42px;border-radius:8px;background:#176b4b;color:#fff;display:grid;place-items:center;font-weight:800}.head h1{margin:0;font-size:22px}.head p{margin:4px 0 0;color:#6c7972;font-size:12px}.panel{background:#fff;border:1px solid #dce3df;border-radius:8px;padding:20px;margin-bottom:14px}.label{font-size:12px;font-weight:700;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center}.input{flex:1;height:40px;border:1px solid #cbd5cf;border-radius:5px;padding:0 11px;color:#55645c;background:#f8faf9}.button{height:40px;padding:0 15px;border:1px solid #cbd5cf;border-radius:5px;background:#fff;cursor:pointer;font-weight:700}.button.primary{border:0;background:#176b4b;color:#fff}.button:disabled{opacity:.5;cursor:default}.status{display:flex;align-items:center;gap:9px;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#9ba8a0}.dot.running{background:#2ba56c}.hint{color:#6c7972;font-size:11px;line-height:1.7;margin:10px 0 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.fact{padding:12px;border-radius:6px;background:#f5f8f6;font-size:11px;color:#6c7972}.fact b{display:block;color:#18231e;font-size:13px;margin-top:4px}.footer{color:#839088;font-size:10px;line-height:1.6}@media(max-width:600px){.shell{padding:20px}.row{flex-wrap:wrap}.input{flex-basis:100%}.facts{grid-template-columns:1fr}}
</style></head>
<body><main class="shell"><header class="head"><div class="mark">AC</div><div><h1>AceCall Sync</h1><p>本地简历同步助手</p></div></header><section class="panel"><div class="label">监听文件夹</div><div class="row"><input class="input" id="directory" readonly placeholder="请选择要监听的文件夹"><button class="button" id="choose">选择文件夹</button></div><p class="hint" id="platformHint">正在识别设备…</p><div class="facts"><div class="fact">扫描周期<b>每 5 分钟</b></div><div class="fact">处理范围<b>仅新增简历文件</b></div></div></section><section class="panel"><div class="status"><span class="dot" id="dot"></span><b id="status">未启动</b></div><p class="hint" id="message">选择文件夹后启动同步。关闭窗口后，助手会继续在系统托盘运行。</p><div class="row" style="margin-top:16px"><button class="button primary" id="start">启动同步</button><button class="button" id="stop" disabled>暂停同步</button></div></section><p class="footer">支持 PDF、DOC、DOCX、TXT、MD、RTF。文件会先在本地等待写入稳定，再按去重规则发送到 AceCall。首次使用需要配置 AceCall 后端地址和登录会话。</p></main><script>
const $=id=>document.getElementById(id);let selected='';
async function init(){const p=await window.acecallDesktop.getPlatform();$('platformHint').textContent=p.platform==='mac'?'Mac：建议选择 Downloads 文件夹。':p.platform==='windows'?'Windows：请选择需要授权的文件夹。':'请选择需要监听的文件夹。';const c=await window.acecallDesktop.getConfig();if(!c.apiBase)$('message').textContent='当前未配置 AceCall 后端，启动后仅可本地运行；请由管理员配置后端地址。'}
$('choose').onclick=async()=>{selected=await window.acecallDesktop.chooseDirectory();if(selected)$('directory').value=selected};$('start').onclick=async()=>{if(!selected)return $('message').textContent='请先选择文件夹';$('start').disabled=true;try{await window.acecallDesktop.start(selected)}catch(e){$('start').disabled=false;$('message').textContent=e.message}};$('stop').onclick=()=>window.acecallDesktop.stop();window.acecallDesktop.onStatus(s=>{$('status').textContent=s.status==='running'?'监听中':'已暂停';$('dot').className=`dot ${s.status==='running'?'running':''}`;$('message').textContent=s.message||'';$('start').disabled=s.status==='running';$('stop').disabled=s.status!=='running'});init();
</script></body></html>
