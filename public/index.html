<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AceCall AI 电话初筛工作台">
  <title>AceCall · AI 电话初筛工作台</title>
  <link rel="stylesheet" href="./styles-v2.css">
</head>
<body>
  <section class="login-screen" id="loginScreen">
    <form class="login-panel" id="loginForm">
      <span class="login-mark">AC</span>
      <p>AceCall 招聘工作台</p>
      <h1>登录后开始初筛</h1>
      <label><span>账号</span><input id="loginUsername" autocomplete="username" required placeholder="请输入AceCall账号"></label>
      <label><span>密码</span><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="请输入密码"></label>
      <button class="primary" id="loginButton" type="submit">登录</button>
      <small id="loginMessage">候选人简历和AI结果仅对已授权成员开放</small>
    </form>
  </section>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="brand" href="#dashboard"><span>AC</span><strong>AceCall</strong></a>
      <nav>
        <button class="nav-item active" data-view="dashboard"><b>⌂</b><span>工作台</span></button>
        <button class="nav-item" data-view="candidates"><b>◎</b><span>候选人</span><i id="candidateNavCount">0</i></button>
        <button class="nav-item" data-view="jobs"><b>▤</b><span>岗位</span></button>
      </nav>
      <div class="sidebar-bottom"><button class="nav-item" data-view="settings"><b>⚙</b><span>设置</span></button><p>AI辅助招聘判断<br>最终结论由招聘人员确认</p></div>
    </aside>

    <main class="app-main">
      <header class="app-header"><div><span id="breadcrumb">招聘工作台</span></div><div class="header-actions"><span class="service-status" id="serviceStatus"><i></i>连接中</span><button class="avatar" id="logoutButton" type="button" title="退出登录">RM</button></div></header>
      <section class="view active" id="dashboardView"></section>
      <section class="view" id="candidatesView"></section>
      <section class="view" id="jobsView"></section>
      <section class="view" id="candidateDetailView"></section>
      <section class="view" id="settingsView"></section>
    </main>
  </div>

  <dialog id="candidateDialog" class="modal">
    <form id="candidateForm" method="dialog">
      <header><div><small>新增候选人</small><h2>建立初筛档案</h2></div><button type="button" class="icon-close" data-close="candidateDialog">×</button></header>
      <div class="form-grid">
        <label><span>候选人姓名</span><input id="candidateNameInput" required placeholder="例如：张睿"></label>
        <label><span>应聘岗位</span><select id="candidateJobInput" required></select></label>
        <label class="full"><span>候选人简历</span><button type="button" class="upload-zone" id="resumeUploadButton"><b>↑ 上传简历</b><small>PDF、DOCX、TXT、MD，最大10MB</small></button><input id="resumeFileInput" type="file" accept=".pdf,.docx,.txt,.md" hidden><div id="resumeStatus" class="file-status hidden"></div><textarea id="candidateResumeInput" rows="10" required placeholder="上传后自动提取，也可以直接粘贴简历文本"></textarea></label>
      </div>
      <footer><button type="button" class="secondary" data-close="candidateDialog">取消</button><button type="submit" class="primary">保存并生成电话准备</button></footer>
    </form>
  </dialog>

  <dialog id="jobDialog" class="modal">
    <form id="jobForm" method="dialog">
      <header><div><small>岗位资产</small><h2 id="jobDialogTitle">新建岗位</h2></div><button type="button" class="icon-close" data-close="jobDialog">×</button></header>
      <input type="hidden" id="jobIdInput">
      <div class="form-grid">
        <label><span>行业</span><select id="jobIndustryInput"><option>金融</option><option>互联网</option><option>企业服务</option><option>消费零售</option><option>制造业</option><option>其他</option></select></label>
        <label><span>岗位名称</span><input id="jobNameInput" required placeholder="例如：场外期权产品经理"></label>
        <label class="full"><span>岗位JD</span><textarea id="jobJdInput" rows="8" required placeholder="岗位职责、必备条件和加分项"></textarea></label>
        <label class="full"><span>关键词</span><input id="jobKeywordsInput" placeholder="场外期权、RFQ、交易簿记"></label>
        <label class="full"><span>初筛规则</span><textarea id="jobRulesInput" rows="5" placeholder="必问项、可替代经验和明确不匹配条件"></textarea></label>
      </div>
      <footer><button type="button" class="secondary" data-close="jobDialog">取消</button><button type="submit" class="primary">保存岗位</button></footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="./config.js"></script>
  <script type="module" src="./cloudbase-sdk.js"></script>
  <script src="./app-v2.js"></script>
</body>
</html>
